<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus Alunos | Jhow Trainner</title><link rel="icon" type="image/png" href="assets/logo-jhow.png"><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/system.css"></head><body><div class="app"><aside class="sidebar"><div class="side-logo"><a href="index.html"><img src="assets/logo-jhow.png" alt="Jhow Trainner Studio"></a></div><nav class="side-nav"><a class="" href="personal.html"><span>⌂</span><span class="nav-label">Meu dia</span></a><a class="" href="personal-agenda.html"><span>◷</span><span class="nav-label">Agenda</span></a><a class="" href="personal-presencas.html"><span>✓</span><span class="nav-label">Presenças</span></a><a class="active" href="personal-alunos.html"><span>◎</span><span class="nav-label">Alunos</span></a><a class="" href="personal-treinos.html"><span>▣</span><span class="nav-label">Cadastrar treinos</span></a><a class="" href="personal-rotinas.html"><span>↻</span><span class="nav-label">Rotinas</span></a></nav><div class="side-bottom"><button class="btn btn-soft" style="width:100%" onclick="logout()"><span>←</span><span class="nav-label">Sair</span></button></div></aside><main class="main"><header class="app-top"><div><b class="screen-title">Área do personal</b><div class="small muted">Caio</div></div><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn" onclick="toggleTheme()">◐</button><div class="userbox"><div><b>Alunos</b><div class="small muted">Área do personal</div></div><img class="profile-brand-logo" src="assets/logo-jhow.png" alt="Jhow Trainner Studio"></div></div></header><div class="page"><div class="page-head"><div><div class="kicker">ALUNOS</div><h1>Seu histórico de atendimento por pessoa.</h1><p>Você vê somente alunos vinculados a você pelo Admin.</p></div><span class="badge green" id="count">—</span></div><div class="grid3" id="studentCards"></div></div></main></div><nav class="mobile-role-nav"><a href="personal.html">Hoje</a><a href="personal-agenda.html">Agenda</a><a href="personal-presencas.html">Presenças</a><a class="active" href="personal-alunos.html">Alunos</a><a href="personal-treinos.html">Treinos</a><a href="personal-rotinas.html">Rotinas</a></nav><script src="assets/shared.js"></script><script src="assets/system.js"></script><script>const s=getSystem(),p=activePersonal(s),students=s.students.filter(x=>x.personalId===p.id&&x.active);document.querySelector('#count').textContent=students.length+' ALUNOS';document.querySelector('#studentCards').innerHTML=students.map(st=>{const n=nextWorkoutFor(s,st);return `<a class="workout-card" href="personal-aluno.html?id=${st.id}"><div class="profile-head"><div class="avatar-lg">${st.initials}</div><div><h2>${esc(st.name)}</h2><p>${st.frequency}x/semana · ${esc(st.plan.name)}</p></div></div><div class="exercise-lines"><div class="exercise-line"><span>Próximo treino</span><b>${n?n.code+' · '+esc(n.name):'Sem rotina'}</b></div><div class="exercise-line"><span>Plano termina</span><b>${formatDate(st.plan.end)}</b></div><div class="exercise-line"><span>Presença</span><b>${attendanceRate(st)}%</b></div></div></a>`}).join('')||'<div class="empty-state">Nenhum aluno vinculado.</div>';</script></body></html>
